<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../font/css/bkbulmatpro.css">
    <link rel="stylesheet" href="../font/css/sdgothicneo.css">
    <link rel="stylesheet" href="../css/default.css">
    <title>버거킹 비밀번호 재설정</title>
    <style>
        :root {
            --font: "Sandoll GothicNeoRound", sans-serif;
            --font-pre: "Pretendard Variable", sans-serif;
            --font-BKR: "BKR", sans-serif;
            --primary: #512314;
            --baseBorder: #D9CFC6;
            --inputBg: #FFFCF9;
            --placeholder: #EBE6E2;
            --text: #766053;
            --bg: #F4EBDC;
        }

        html {
            font-size: 62.5%;
        }

        body {
            font-family: var(--font);
            font-size: 1.6rem;
            color: var(--primary);
        }

        #wrap {
            width: 100%;
            max-width: 1024px;
            min-width: 360px;
            margin: 0 auto;
            background-color: var(--bg);
        }

        header {
            position: relative;
            display: flex;
            justify-content: center;
            height: 48px;
        }

        h1 {
            font-size: 2rem;
            order: 2;
        }

        .prev_btn {
            position: absolute;
            left: 0;
            width: 48px;
            height: 48px;
            background: url(img/back_icon.svg) no-repeat center / auto;
            border: none;
        }

        main {
            padding: 48px 20px 90px;
        }

        section + section {
            margin-top: 50px;
        }

        h2 {
            margin-bottom: 16px;
            font-family: var(--font-BKR);
            font-size: 2.5rem;
            line-height: 1.2;
        }

        .description {
            margin-bottom: 30px;
            color: var(--text);
            line-height: 1.5;
        }

        fieldset {
            border: 0;
        }

        legend {
            margin-bottom: 8px;
            font-size: 1.5rem;
        }

        .input_box {
            position: relative;
            margin-bottom: 10px;
        }

        input[type="password"] {
            width: 100%;
            height: 50px;
            padding: 0 56px 0 20px;
            border: 1px solid var(--baseBorder);
            border-radius: 10px;
            background-color: var(--inputBg);
        }

        input::placeholder {
            color: var(--placeholder);
        }

        .pw_btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            border: none;
            background: url(img/eye_icon.svg) no-repeat center / 26px;
        }

        .notice_list {
            margin-bottom: 16px;
        }

        .notice_list li {
            position: relative;
            padding-left: 12px;
            color: var(--text);
            line-height: 1.7;
        }

        .notice_list li::before {
            content: "•";
            position: absolute;
            left: 0;
        }

        .notice {
            color: var(--text);
            font-size: 1.4rem;
            line-height: 1.5;
        }

        .sns_notice {
            color: var(--text);
            line-height: 1.5;
        }

        .complete_btn {
            width: 100%;
            height: 44px;
            margin-top: 50px;
            border: none;
            border-radius: 22px;
            font-family: inherit;
            font-size: inherit;
            color: var(--placeholder);
            background-color: var(--primary);
            opacity: 0.2;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>비밀번호 재설정</h1>
            <button type="button" class="prev_btn">
                <span class="sr-only">이전 버튼</span>
            </button>
        </header>

        <main>
            <section>
                <h2>새로운 비밀번호를 입력해 주세요.</h2>
                <p class="description">새로운 비밀번호를 입력하고 확인해 주세요.</p>

                <form action="">
                    <fieldset>
                        <legend>새로운 비밀번호</legend>

                        <label class="sr-only" for="password">새로운 비밀번호</label>
                        <div class="input_box">
                            <input type="password" id="password" name="password" placeholder="새로운 비밀번호를 입력해 주세요">
                            <button type="button" class="pw_btn">
                                <span class="sr-only">비밀번호 보기</span>
                            </button>
                        </div>

                        <label class="sr-only" for="password-confirm">새로운 비밀번호 확인</label>
                        <div class="input_box">
                            <input type="password" id="password-confirm" name="password-confirm" placeholder="비밀번호를 다시 입력해 주세요">
                            <button type="button" class="pw_btn">
                                <span class="sr-only">비밀번호 보기</span>
                            </button>
                        </div>
                    </fieldset>
                </form>
            </section>

            <section>
                <h2>비밀번호 설정 조건</h2>
                <ul class="notice_list">
                    <li>영문, 숫자, 특수문자를 포함해 주세요.</li>
                    <li>8자 이상 입력해 주세요.</li>
                    <li>연속된 문자는 사용할 수 없습니다.</li>
                </ul>
                <p class="notice">안전한 비밀번호를 사용해 주세요.</p>
            </section>

            <section>
                <h2>SNS 서비스 비밀번호 재설정 안내</h2>
                <p class="sns_notice">SNS 계정으로 가입한 경우 해당 SNS 서비스에서 비밀번호를 재설정해 주세요.</p>
            </section>

            <button type="submit" class="complete_btn">완료</button>
        </main>
    </div>
</body>
</html>
