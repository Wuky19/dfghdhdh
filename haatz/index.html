<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하츠 웹사이트 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="site-header"><a href="./" aria-label="하츠 리뉴얼 홈">HAATZ</a></header>
        <main>
            <section class="hero-sec" aria-label="하츠 주요 제품">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="assets/images/hero.jpg" alt="하츠 인덕션 배너" class="pc">
                            <img src="assets/images/image_a32a0648.jpg" alt="하츠 인덕션 모바일 배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="assets/images/hero.jpg" alt="하츠 인덕션 배너" class="pc">
                            <img src="assets/images/image_a32a0648.jpg" alt="하츠 인덕션 모바일 배너" class="mo">
                        </div>
                    </div>
                    <div class="swiper-pagination"></div>
                    <button type="button" class="swiper-button-prev" aria-label="이전 배너"></button>
                    <button type="button" class="swiper-button-next" aria-label="다음 배너"></button>
                    <div class="swiper-scrollbar"></div>
                </div>
            </section>
        </main>
        <footer class="site-footer"><p>HAATZ 웹사이트 리뉴얼 포트폴리오</p></footer>
    </div>
    <script>
        const swiper = new Swiper('.hero-sec .swiper', {
            direction: 'horizontal',
            loop: true,
            pagination: { el: '.visual .swiper-pagination', clickable: true },
            navigation: { nextEl: '.visual .swiper-button-next', prevEl: '.visual .swiper-button-prev' },
            scrollbar: { el: '.visual .swiper-scrollbar' },
        });
    </script>
</body>
</html>
